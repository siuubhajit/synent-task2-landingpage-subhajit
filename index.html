<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacelog</title>
  <link rel="stylesheet" href="style.css">
  <script>
    const savedTheme = localStorage.getItem("theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const theme = savedTheme || (prefersDark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  </script>
</head>

<body>
  <div class="top-bar">
    <button id="theme-toggle" type="button" aria-label="Toggle theme">◐</button>
  </div>

  <main class="splash-content">
    <img src="runner-light.png" alt="Runner" class="runner runner-light">
    <img src="runner-dark.png" alt="Runner" class="runner runner-dark">
    <h1 class="name"><a href="landing/index.html">Pacelog</a></h1>
  </main>

  <script>
    const themeToggle = document.getElementById("theme-toggle");

    themeToggle.addEventListener("click", () => {
      const root = document.documentElement;
      const nextTheme = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", nextTheme);
      localStorage.setItem("theme", nextTheme);
    });
  </script>
</body>
</html>
